# Rebuilds the profile quote card and publishes it to GitHub Pages every 5 minutes.
# README embeds https://codemarquis.github.io/codemarquis/quote.svg
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: quote

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [quotes.json, scripts/build-quote.mjs, .github/workflows/quote.yml]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/build-quote.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
